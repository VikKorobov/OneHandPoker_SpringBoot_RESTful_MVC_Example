name: onehandpoker

services:
  # ---------- Spring Boot Application ----------
  app:
    # Build the application image using the local Dockerfile
    build: .
    container_name: onehandpoker-app

    # Expose the REST API
    ports:
      - "8080:8080"

    # Wait until the external services are ready
    depends_on:
      db:
        condition: service_healthy
      mock-user:
        condition: service_healthy

    # Configure Spring Boot and its external connections
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/onehandpoker
      SPRING_DATASOURCE_USERNAME: onehandpoker
      SPRING_DATASOURCE_PASSWORD: onehandpoker
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      USER_SERVICE_URL: http://mock-user:8080

  # ---------- PostgreSQL Database ----------
  db:
    # PostgreSQL 17 image
    image: postgres:17
    container_name: onehandpoker-db

    # Expose PostgreSQL for local external connections
    ports:
      - "127.0.0.1:5432:5432"

    # Initialize the database and its credentials
    environment:
      POSTGRES_DB: onehandpoker
      POSTGRES_USER: onehandpoker
      POSTGRES_PASSWORD: onehandpoker

    # Check whether PostgreSQL is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehandpoker -d onehandpoker"]
      interval: 5s
      timeout: 5s
      retries: 10

    # Persist database data across container restarts
    volumes:
      - onehandpoker-db-data:/var/lib/postgresql/data

  # ---------- Mock User Service ----------
  #NOTE:
  # WireMock is used in this example for demonstration purposes only.
  # It simulates an external User microservice without implementing
  # actual user management, business logic, or persistent data storage.
  #
  # The simulated service considers even user IDs to represent
  # existing users and odd user IDs to represent nonexistent users.
  mock-user:
    # Standalone WireMock image
    image: wiremock/wiremock:3.13.2
    container_name: onehandpoker-mock-user

    # Expose WireMock for local testing
    ports:
      - "127.0.0.1:8081:8080"

    # Mount mock endpoint definitions and response files
    volumes:
      - ./infrastructure/wiremock:/home/wiremock:ro

    # Check whether WireMock is ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 10

# ---------- Persistent Storage ----------
volumes:
  onehandpoker-db-data: